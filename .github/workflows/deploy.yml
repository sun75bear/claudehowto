name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:        # Actions タブから手動実行もできるようにする

permissions:
  contents: read
  pages: write              # GitHub Pages へ書き込む権限
  id-token: write           # デプロイ時の認証に必要

concurrency:
  group: pages              # 連続 push しても順番に処理させる
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict    # リンク切れがあればここで失敗させる
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
