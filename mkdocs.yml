# サイト全体の設定。ここ1ファイルで見た目・機能・章立てが決まる。
site_name: はじめての Claude
site_description: 契約から実務での使い方まで、Claude をゼロから始めるための案内

# TODO: リポジトリを作ったら、次の3行のコメントを外して <USER> / <REPO> を実際の名前にする
#        （site_url を設定するとローカルプレビューも /<REPO>/ 配下になります）
# site_url: https://<USER>.github.io/<REPO>/
# repo_url: https://github.com/<USER>/<REPO>
# edit_uri: edit/main/docs/

theme:
  name: material
  language: ja                       # UI の文言を日本語化
  palette:                           # ライト / ダークの切替ボタンを出す
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  features:
    - navigation.sections            # 左サイドバーを章ごとにグループ表示
    - navigation.top                 # 「上へ戻る」ボタン
    - navigation.footer              # 前後のページへのリンクを下部に出す
    - content.code.copy              # コードブロックにコピーボタン
    - search.suggest                 # 検索の候補表示
    - search.highlight               # 検索語をページ内でハイライト
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:                          # 日本語の全文検索を有効化
        - ja
        - en

markdown_extensions:
  - admonition                       # !!! note の注意書きボックス
  - attr_list                        # 画像やリンクに属性を付ける
  - md_in_html
  - tables
  - pymdownx.details                 # 折りたたみ
  - pymdownx.superfences:            # 高機能コードブロック（タブ内・図の描画に必要）
      custom_fences:
        - name: mermaid                # ```mermaid を図としてレンダリングする
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:                 # === "Windows" / === "Mac" のタブ切替
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true                # 見出しへの直リンク
      toc_depth: 3

nav:                                 # 章の並び順をここで固定する
  - このサイトについて: index.md
  - 1. 何ができるか: 01-what-it-does.md
  - 2. Pro を1か月試す: 02-pro-trial.md
  - 3. インストールする: 03-install.md
  - 4. 最初に動かす: 04-first-run.md
  - 5. この先は自分で: 05-next.md

copyright: 2026年8月時点の情報にもとづいて書いています
