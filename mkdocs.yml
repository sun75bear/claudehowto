# サイト全体の設定。ここ1ファイルで見た目・機能・章立てが決まる。
site_name: はじめての Claude
site_description: 契約から実務での使い方まで、Claude をゼロから始めるための案内

# TODO: リポジトリを作ったら、次の3行のコメントを外して <USER> / <REPO> を実際の名前にする
#        （site_url を設定するとローカルプレビューも /<REPO>/ 配下になります）
# site_url: https://<USER>.github.io/<REPO>/
# repo_url: https://github.com/<USER>/<REPO>
# edit_uri: edit/main/docs/

theme:
  name: material
  language: ja                       # UI の文言を日本語化
  palette:                           # ライト / ダークの切替ボタンを出す
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  features:
    - navigation.sections            # 左サイドバーを章ごとにグループ表示
    - navigation.top                 # 「上へ戻る」ボタン
    - navigation.footer              # 前後のページへのリンクを下部に出す
    - content.code.copy              # コードブロックにコピーボタン
    - search.suggest                 # 検索の候補表示
    - search.highlight               # 検索語をページ内でハイライト
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:                          # 日本語の全文検索を有効化
        - ja
        - en

markdown_extensions:
  - admonition                       # !!! note の注意書きボックス
  - attr_list                        # 画像やリンクに属性を付ける
  - md_in_html
  - tables
  - pymdownx.details                 # 折りたたみ
  - pymdownx.superfences:            # 高機能コードブロック（タブ内・図の描画に必要）
      custom_fences:
        - name: mermaid                # ```mermaid を図としてレンダリングする
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:                 # === "Windows" / === "Mac" のタブ切替
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true                # 見出しへの直リンク
      toc_depth: 3

nav:                                 # 章の並び順をここで固定する
  - はじめに:
      - このサイトについて: index.md
      - 1. なぜ Claude Code なのか: 01-why-claude-code.md
  - 使い始める:
      - 2. Pro を契約する: 02-pro-plan.md
      - 3. インストールする: 03-setup.md
      - 4. 最初のセッション: 04-first-session.md
  - 実際に使う:
      - 5. 実例集（コードを書かない仕事）: 05-examples.md
      - 6. 実例集（コードを書く人向け）: 06-examples-dev.md
      - 7. 使いこなす: 07-power-up.md
  - 補足:
      - 8. チャットとの使い分け: 08-with-chat.md
      - 9. 気をつけること: 09-cautions.md
  - 困ったとき:
      - 10. FAQ・トラブル対応: 10-faq.md
      - 用語集とリンク集: 99-glossary.md

copyright: 2026年8月時点の情報にもとづいて書いています
